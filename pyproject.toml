[project]
name = "thoughtformula"
version = "0.3.0"
description = "Pure-Python generative Transformer architecture with FlashAttention, Paged KV-Cache, BitNet b1.58, KTO, Medusa, and Continuous Batching"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = [
    "transformer",
    "pure-python",
    "deep-learning",
    "attention",
    "flashattention",
    "moe",
    "lora",
    "speculative-decoding",
    "kto",
    "dpo",
    "bitnet",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/wispsy/thoughtformula"
Repository = "https://github.com/wispsy/thoughtformula"
Issues = "https://github.com/wispsy/thoughtformula/issues"
Documentation = "https://github.com/wispsy/thoughtformula#readme"

[project.scripts]
thoughtformula = "thoughtformula.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "scripts/**"]
